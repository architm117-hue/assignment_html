<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header, footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }
        main {
            max-width: 600px;
            margin: auto;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        fieldset {
            margin-top: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            max-width: 100%;
            padding: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>Application Form</h2>
            <form action="submit.php" method="post">
                <fieldset>
                    <legend>Personal Details</legend>

                    <label for="student-name">Name:</label>
                    <input type="text" id="student-name" name="name" required>

                    <label for="student-email">Email:</label>
                    <input type="email" id="student-email" name="email" required>

                    <label for="student-mobile">Mobile:</label>
                    <input type="tel" id="student-mobile" name="mobile"
                        pattern="[0-9]{10}" title="Enter exactly 10 digits" required>

                    <label for="student-course">Course:</label>
                    <select id="student-course" name="course" required>
                        <option value="">Select a course</option>
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="BCA">BCA</option>
                    </select>

                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement" rows="4"></textarea>

                    <br><br>
                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
