<!DOCTYPE html>
<html>
<head>
    <title>Semantic Elements</title>
</head>
<body>
    <header>
        <h1>College Portal</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">Courses</a>
    </nav>

    <main>
        <section>
            <h2>Admission Open</h2>
            <p>Apply before 30 June.</p>
        </section>
    </main>

    <aside>
        <p>Notice: Library closed Sunday.</p>
    </aside>

    <footer>
        <p>&copy; 2026 College</p>
    </footer>

    <!-- A div is a non-semantic element -->
    <div>This is a simple div container.</div>
</body>
</html>
